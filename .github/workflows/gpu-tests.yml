name: GPU Tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpu-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gpu-tests:
    name: Full NVIDIA GPU suite
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Verify GPU environment
        run: |
          nvidia-smi
          python - <<'PY'
          import torch
          import triton

          assert torch.cuda.is_available(), "CUDA is not available on the GPU runner"
          print(f"PyTorch: {torch.__version__}")
          print(f"Triton: {triton.__version__}")
          print(f"GPU: {torch.cuda.get_device_name(0)}")
          PY

      - name: Run full GPU test layer
        run: python -m pytest -q --hypothesis-profile=ci
